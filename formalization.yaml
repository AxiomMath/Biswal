# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "Biswal"
  authors: [Kenny Lau]
  description: >
    `Biswal` is a formal proof of the coefficient results for Chebyshev quotients in *Chebyshev
    quotients, Demazure multiplicities, and Dyck-path models* (arXiv:2604.25246). For the
    generating function $F_{\lambda,m,\mu}(x) = \sum_{r \ge 0} a_r x^r$ it proves Theorem 1.1,
    which splits the quotient into a polynomial case and an eventually positive case; Theorem 1.2,
    the signed summation formula for $a_r$; Theorem 1.3, the factorization into Dyck-path counts
    $D_m(a,b;u)$ and the resulting nonnegativity; and Lemma 3.3, the coefficient formula for
    $p_n$. The Lean files were generated by AxiomProver, Axiom Math's in-house theorem proving
    system.
  responsible_maintainers: [Kenny Lau]
  license: "MIT"

repository:
  role: "substantive-development"

sources:
  - title: "Chebyshev quotients, Demazure multiplicities, and Dyck-path models"
    authors: [Rekha Biswal, Ken Ono, Jujian Zhang]
    id: "https://arxiv.org/abs/2604.25246"
    type: "article"
    location: "Theorem 1.1, Theorem 1.2, Theorem 1.3, Lemma 3.3"
    relationship: "formalizes"
    note: >
      Formalizes the three main theorems, split across two problem/solution pairs, together with
      the coefficient formula they rest on.

classification:
  arxiv: [math.RT, math.CO]
  msc2020: [17B67, 05A15, 33C45, 11P84]

status:
  scope: >
    Theorem 1.1 in all three of its parts, over any field; Theorem 1.2 and Theorem 1.3 in all
    three of theirs; and Lemma 3.3 over any commutative ring. Theorem 1.1 (2)(b) is stated over
    $\mathbb{Q}$, where the positivity of $a_r$ can be expressed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  main_results:
  - declaration: "genFun_eq_one_of_m_eq_one"
    file: "Biswal/theorem1/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator-theorem1.json"
  - declaration: "genFun_is_polynomial"
    file: "Biswal/theorem1/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator-theorem1.json"
  - declaration: "genFun_coeff_eventually_pos"
    file: "Biswal/theorem1/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator-theorem1.json"
  - declaration: "polyP_coeff"
    file: "Biswal/theorem2and3/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator-theorem2and3.json"
  - declaration: "thm_comb_cauchy"
    file: "Biswal/theorem2and3/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator-theorem2and3.json"
  - declaration: "thm_comb"
    file: "Biswal/theorem2and3/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator-theorem2and3.json"
  - declaration: "thm_manifest_factorization"
    file: "Biswal/theorem2and3/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator-theorem2and3.json"
  - declaration: "thm_manifest_coeff_formula"
